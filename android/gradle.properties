# ===========================================
# MEMORY-OPTIMIZED GRADLE CONFIGURATION
# For M-series Mac with 16GB RAM
# ===========================================

# JVM Memory Settings (reduced from 4G to 2G)
# -Xmx2G: Max heap size 2GB (sufficient for most Flutter builds)
# -Xms512m: Initial heap 512MB (reduces startup memory footprint)
# -XX:MaxMetaspaceSize=512m: Limit metaspace to prevent bloat
# -XX:+UseG1GC: Use G1 garbage collector (best for limited memory)
# -XX:MaxGCPauseMillis=200: Target max GC pause time
# -XX:+UseStringDeduplication: Reduce memory from duplicate strings
org.gradle.jvmargs=-Xmx2G -Xms512m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Gradle Performance Optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin Compiler Optimizations
kotlin.incremental=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1G -Xms256m

# Android Specific Optimizations
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
