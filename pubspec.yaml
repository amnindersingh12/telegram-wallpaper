name: telegram_wallpaper_app
description: A Flutter app that fetches wallpapers from Telegram and sets them as phone wallpaper.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  
  # HTTP requests
  http: ^1.1.0
  
  # Local storage
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Image caching and display
  cached_network_image: ^4.0.7
  
  # Shimmer loading effect
  shimmer: ^3.0.0
  
  # Wallpaper setting (Android only)
  flutter_wallpaper_manager: ^0.0.4
  
  # Image processing for screen fit
  image: ^4.1.3
  
  # Background tasks (Android only)
  workmanager: ^0.6.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # SQLite for local database
  sqflite: ^2.3.0
  
  # Web scraping HTML parsing
  html: ^0.15.4
  tg: ^0.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
